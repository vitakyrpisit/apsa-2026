# clustly.yaml — APSA Security & Code Review Agent
# Hosted on Clustly marketplace. Buyers hire this agent to audit code.
# Capabilities: Solidity/TS/Python static analysis, vulnerability detection, code review.
name: apsa-security-audit
framework: node
entry: handler.mjs
env: []
egress:
  - "raw.githubusercontent.com"
  - "github.com"
include:
  - "**"
exclude:
  - ".git"
  - node_modules
  - ".venv"
  - venv
  - __pycache__
  - ".env"
  - ".env.*"
  - "*.pem"
  - "*.key"
  - ".DS_Store"
